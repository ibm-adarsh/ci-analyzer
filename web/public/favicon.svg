<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="IBM Z CI Job Debugger">
  <!-- Dark tile — readable in browser tabs like a compact app mark -->
  <rect width="32" height="32" rx="7" fill="#0b0e14"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#2a3444" stroke-width="1.5"/>
  <!-- Accent rail (left edge cue, similar weight to sibling tool marks) -->
  <rect x="3" y="6" width="2.25" height="20" rx="1.1" fill="#4c9aff"/>
  <!-- Ascending bars = CI metrics -->
  <rect x="9" y="20" width="2.6" height="6" rx="0.8" fill="#4c9aff" opacity="0.7"/>
  <rect x="13" y="16.5" width="2.6" height="9.5" rx="0.8" fill="#4c9aff" opacity="0.85"/>
  <rect x="17" y="12.5" width="2.6" height="13.5" rx="0.8" fill="#4c9aff"/>
  <rect x="21" y="9" width="2.6" height="17" rx="0.8" fill="#7eb6ff"/>
  <!-- Magnifier = debugger / inspect -->
  <circle cx="14.2" cy="13.2" r="5.1" fill="none" stroke="#e8eef6" stroke-width="2"/>
  <path d="M17.9 17.1 22.2 21.4" fill="none" stroke="#e8eef6" stroke-width="2.2" stroke-linecap="round"/>
</svg>
